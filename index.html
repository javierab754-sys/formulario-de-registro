<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Comunidad</title>
</head>
<body>

    <!-- Título principal -->
    <h1>¡Regístrate y únete a la comunidad!</h1>

    <!-- Formulario -->
    <form>
        <!-- Nombre -->
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre"><br><br>

        <!-- Apellido -->
        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" name="apellido"><br><br>

        <!-- Correo Electrónico -->
        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" name="email"><br><br>

        <!-- Contraseña -->
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password"><br><br>

        <!-- Confirmar Contraseña -->
        <label for="confirm-password">Confirmar Contraseña:</label>
        <input type="password" id="confirm-password" name="confirm-password"><br><br>

        <!-- Fecha de Nacimiento -->
        <label for="fecha">Fecha de Nacimiento:</label>
        <input type="date" id="fecha" name="fecha"><br><br>

        <!-- Género (Radio buttons) -->
        <label>Género:</label>
        <input type="radio" id="masculino" name="genero" value="masculino">
        <label for="masculino">Masculino</label>
        
        <input type="radio" id="femenino" name="genero" value="femenino">
        <label for="femenino">Femenino</label>
        
        <input type="radio" id="otro" name="genero" value="otro">
        <label for="otro">Prefiero no decir</label><br><br>

        <!-- Casilla de verificación (Checkbox) -->
        <input type="checkbox" id="boletin" name="boletin">
        <label for="boletin">Suscríbete a nuestro boletín de noticias</label><br><br>

        <!-- Área de texto -->
        <label for="descripcion">Una descripción de mí mismo:</label><br>
        <textarea id="descripcion" name="descripcion" rows="4" cols="40"></textarea>

    </form>

</body>
</html>
